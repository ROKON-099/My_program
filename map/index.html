<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Product List</title>
  
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 p-10">

  <h1 class="text-3xl font-bold text-center mb-8">Our Products</h1>
 
  <div id="product-container" class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-5 gap-6"></div>

  <script>
    const users = [  
      { id: 1, name: 'laptop', price: '1000', image: "https://i.pravatar.cc/150?img=1" },
      { id: 2, name: 'bolod', price: '2000', image: "https://i.pravatar.cc/150?img=2" }, 
      { id: 3, name: 'phone', price: '3000', image: "https://i.pravatar.cc/150?img=3" },
      { id: 4, name: 'watch', price: '4000', image: "https://i.pravatar.cc/150?img=4" },
      { id: 5, name: 'tablet', price: '5000', image: "https://i.pravatar.cc/150?img=5" }
    ]

    const container = document.getElementById('product-container')

   
    const productCards = users.map(user => {
      return `
        <div class="bg-white rounded-xl shadow-md p-4 hover:shadow-lg transition">
          <img 
            src="${user.image}" 
            alt="${user.name}" 
            class="w-full h-40 object-cover rounded-lg mb-3"
          />
          <h2 class="text-xl font-bold capitalize">${user.name}</h2>
          <p class="text-gray-600">Price: $${user.price}</p>
          <button class="mt-3 w-full bg-orange-500 hover:bg-orange-600 text-white py-2 rounded-lg">
            Buy Now
          </button>
        </div>
      `
    }).join('') 

   
    container.innerHTML = productCards

  </script>
</body>
</html>
