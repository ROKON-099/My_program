<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Hero Section</title>

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Bootstrap Icons -->
    <link rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

    <style>
        .hero {
            min-height: 100vh;
            background: linear-gradient(rgba(0,0,0,.55),rgba(0,0,0,.55)),
                        url("https://images.unsplash.com/photo-1500530855697-b586d89ba3ee?auto=format&fit=crop&w=1800&q=80");
            background-size: cover;
            background-position: center;
            display: flex;
            align-items: center;
        }

        .hero-content{
            color:#fff;
        }

        .hero-content h1{
            font-size:60px;
            font-weight:700;
        }

        .hero-content p{
            font-size:18px;
            max-width:700px;
            margin:auto;
        }

        .search-box{
            background:#fff;
            border-radius:20px;
            padding:30px;
            margin-top:50px;
            box-shadow:0 15px 40px rgba(0,0,0,.2);
        }

        .form-control,
        .form-select{
            height:50px;
        }

        .btn-search{
            height:50px;
            width:100%;
        }
    </style>

</head>

<body>

<section class="hero">

    <div class="container">

        <div class="hero-content text-center">

            <span class="badge bg-primary px-4 py-2 fs-6">
                Find Your Perfect Ride
            </span>

            <h1 class="mt-4">
                Book Your Dream Vehicle <br>
                Anytime, Anywhere
            </h1>

            <p class="mt-3">
                Browse thousands of cars, SUVs, bikes and luxury vehicles
                at the best prices for your next journey.
            </p>

        </div>

        <!-- Search Form -->

        <div class="search-box">

            <div class="row g-3">

                <div class="col-lg-3">
                    <label class="form-label">Location</label>
                    <select class="form-select">
                        <option>Select Location</option>
                        <option>Dhaka</option>
                        <option>Chattogram</option>
                        <option>Sylhet</option>
                    </select>
                </div>

                <div class="col-lg-3">
                    <label class="form-label">Vehicle Type</label>
                    <select class="form-select">
                        <option>Choose Vehicle</option>
                        <option>Car</option>
                        <option>Bike</option>
                        <option>Bus</option>
                        <option>Microbus</option>
                    </select>
                </div>

                <div class="col-lg-3">
                    <label class="form-label">Category</label>
                    <select class="form-select">
                        <option>Select Category</option>
                        <option>Luxury</option>
                        <option>Economy</option>
                        <option>Family</option>
                    </select>
                </div>

                <div class="col-lg-3">
                    <label class="form-label">Pickup Date</label>
                    <input type="date" class="form-control">
                </div>

                <div class="col-lg-3">
                    <label class="form-label">Drop-off Date</label>
                    <input type="date" class="form-control">
                </div>

                <div class="col-lg-3">
                    <label class="form-label">Passengers</label>
                    <select class="form-select">
                        <option>1 Person</option>
                        <option>2 Persons</option>
                        <option>4 Persons</option>
                        <option>6+ Persons</option>
                    </select>
                </div>

                <div class="col-lg-3">
                    <label class="form-label">Price Range</label>
                    <select class="form-select">
                        <option>$0 - $100</option>
                        <option>$100 - $300</option>
                        <option>$300 - $500</option>
                        <option>$500+</option>
                    </select>
                </div>

                <div class="col-lg-3 d-flex align-items-end">
                    <button class="btn btn-primary btn-search">
                        <i class="bi bi-search"></i> Search Vehicle
                    </button>
                </div>

            </div>

        </div>

    </div>

</section>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
